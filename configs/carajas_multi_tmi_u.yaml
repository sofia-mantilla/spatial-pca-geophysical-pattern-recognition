project:
  name: "Carajas IOCG multivariate TMI + Radiometric U demo"
  case: "Alemao / Deposit 3"
  selected_variables: ["TMI", "Radiometric_U"]
  training_deposit_id: 3
  analysis_type: "Multi"

data_root: "/path/to/shared/project/data"
carajas:
  tmi_path: "/path/to/Carajas/TMI.ers"
  radiometric_u_path: "/path/to/Carajas/Radiometric_U.ers"
  study_area_polygon: "/path/to/Carajas/Demo_area_polygon.shp"
  deposits_shapefile: "/path/to/Carajas/deposits.shp"

run:
  base_output_dir: "outputs"
  run_mode: "sweep_kpcs"
  analysis_type: "Multi"
  method_name: "Spatial_PCA"
  outputs_subdir: "Output_Carajas_Multi"
  uni_selected_variable: "TMI"
  multi_ranking_mode: "two_stage_pca_fusion"

sweep:
  deposits_1based: [3]
  kpcs: [17]
  score_w_auc: 0.45
  score_w_red_points: 0.35
  score_w_hit_early: 0.2
  targets_shp_mode: "carajas"
  best_kpcs_source_tag: "carajas"
  fusion_weight_var1: 0.5
  fusion_weight_var2: 0.5
  top_windows_color_scale_mode: "config_range"

reconstruction:
  extra_pcs: 3
  enable: true

analysis_defaults:
  variable_1: "TMI"
  variable_2: "Radiometric_U"
  vmin_var2: 0
  vmax_var2: 15
  rotation_angle: 0
  stride_x: 8
  stride_y: 8
  n_top_windows: 250
  top_windows_plot_n_rows: 2
  top_windows_plot_n_cols: 4
  force_crs: "EPSG:32722"
  show_plots: false
  min_cover: 0.5

visualization:
  image_colormap: "spatial_pca_paper"
  score_pairs_top_n_to_plot: 3
  deposit_limits_tmi:
    "1": [-250, 300]
    "2": [-200, 400]
    "3": [-150, 150]
    "4": [-600, 400]
    "5": [-200, 400]
    "6": [-200, 400]
    "7": [-150, 300]
    "8": [-200, 300]
    "9": [-100, 100]
    "10": [-200, 300]
    "11": [-300, 500]
    "12": [-200, 400]

paths:
  tmi_file_path: "/path/to/Carajas/TMI.ers"
  rad_file_path: "/path/to/Carajas/Radiometric_U.ers"
  polygon_path: "/path/to/Carajas/Demo_area_polygon.shp"
  nodata_to_nan: -99999.0

targets:
  deposits_shp_paths:
    carajas: "/path/to/Carajas/deposits.shp"

best_kpcs_files:
  multicriteria_filename_template: "kpcs_best_multicriteria_by_deposit_{csv_file_tag}.csv"
  multicriteria_legacy_filename_template: "kpcs_best_multicriteria_by_deposit_{best_kpcs_source_tag}.csv"
  var1_filename: "kpcs_best_multicriteria_by_deposit_spca_uni_tmi.csv"
  var1_legacy_filename: "kpcs_best_multicriteria_by_deposit_uni_tmi.csv"
  var2_filename: "kpcs_best_multicriteria_by_deposit_spca_uni_radiometric_u.csv"
  var2_legacy_filename: "kpcs_best_multicriteria_by_deposit_uni_radiometric_u.csv"
  var1_kpcs: 2
  var2_kpcs: 34
